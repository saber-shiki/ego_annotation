[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-annotation"
version = "0.2.0"
description = "Grouped metric ego-video observation and scene optimization"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "opencv-python-headless>=4.9",
  "pillow>=10", "jsonschema>=4.20", "PyYAML>=6", "trimesh>=4",
]

[project.optional-dependencies]
visual = ["torch>=2", "smplx==0.1.28", "open3d==0.19.0", "rerun-sdk==0.37.2", "chumpy>=0.70"]
test = ["pytest>=8"]

[project.scripts]
ego-annotate = "main:main"

[tool.setuptools]
py-modules = ["main", "render"]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "observations*", "gates*", "factors*", "optimization*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["test_pipeline.py", "observations", "gates", "factors", "optimization"]
