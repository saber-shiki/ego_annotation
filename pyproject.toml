[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-annotation"
version = "0.2.0"
description = "Grouped metric ego-video observation and scene optimization"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "opencv-python-headless>=4.9",
  "pillow>=10", "jsonschema>=4.20", "PyYAML>=6", "trimesh>=4",
]

[project.optional-dependencies]
visual = ["torch>=2", "smplx==0.1.28", "open3d==0.19.0", "rerun-sdk==0.37.2", "chumpy>=0.70"]
rl = ["torch>=2.6", "gymnasium>=1.1", "skrl==2.1.0"]
test = ["pytest>=8"]

[project.scripts]
ego-observe = "main:cli"
ego-annotate = "main:cli"
ego-optimize = "optimize:cli"
ego-render = "render:main"
ego-evaluate = "evaluate:main"
ego-train = "train:main"
ego-rollout = "rollout:main"

[tool.setuptools]
py-modules = ["main", "optimize", "render", "evaluate", "train", "rollout"]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "observations*", "actions*", "data*", "envs*", "rewards*", "models*", "configs*", "legacy_optimize*"]
namespaces = true

[tool.setuptools.package-data]
configs = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["test_pipeline.py", "tests", "observations", "actions", "envs", "rewards", "legacy_optimize"]
