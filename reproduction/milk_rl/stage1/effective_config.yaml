environment:
  action_filter:
    mode: physical_residual_filter
  action_scales:
    contact_logit: 1.0
    hand_articulation_rad: 0.05
    hand_root_rad: 0.05
    hand_translation_m: 0.01
    object_rotation_rad: 0.05
    object_translation_m: 0.01
  causal_history_frames: 8
  contact_variables_per_hand: 5
  max_objects: 1
  object_translation_frame: world
  observation_contract:
    forbidden:
    - ground_truth
    - future_policy_results
    - legacy_optimized_results
    sources:
    - current_observations
    - accepted_causal_history
  reward_profile: formal_annotation
  reward_scale: 1.0e-05
experiment:
  checkpoint_interval: 0
  write_interval: 0
model:
  encoder:
    activation: elu
    hidden_dims:
    - 256
    - 256
    layer_norm: true
  observation_feature_groups: null
  policy:
    initial_log_std: -1.0
    max_log_std: 1.0
    min_log_std: -5.0
    zero_mean_init: true
  state_feature_groups: null
  value:
    use_states: false
ppo:
  discount_factor: 1.0
  entropy_loss_scale: 0.0
  gae_lambda: 0.95
  grad_norm_clip: 0.5
  kl_threshold: 0.0
  learning_epochs: 8
  learning_rate: 0.0003
  learning_starts: 0
  mini_batches: 8
  mixed_precision: false
  random_timesteps: 0
  ratio_clip: 0.2
  rollouts: 128
  time_limit_bootstrap: true
  value_clip: 0.2
  value_loss_scale: 1.0
rollout:
  disable_progressbar: false
  headless: true
  stochastic_evaluation: false
  timesteps: null
runtime:
  dataset_class: data.dataset:EpisodeDataset
  environment_class: envs.annotation_env:AnnotationEnv
  skrl_version: 2.1.0
trainer:
  disable_progressbar: true
  headless: true
  timesteps: 1024
