environment:
  max_objects: 1
  contact_variables_per_hand: 5
  causal_history_frames: 8
  action_scales:
    hand_root_rad: 0.05
    hand_articulation_rad: 0.05
    hand_translation_m: 0.01
    object_rotation_rad: 0.05
    object_translation_m: 0.01
    contact_logit: 1.0
  object_translation_frame: world
  reward_profile: formal_annotation
  reward_scale: 1.0
  action_filter:
    mode: physical_residual_filter
  observation_contract:
    sources:
    - current_observations
    - accepted_causal_history
    forbidden:
    - ground_truth
    - future_policy_results
    - legacy_optimized_results
  preprocessed_state_adapter: coarse_scene_v1_source_v2_rgb
solver:
  contract: direct_native_nonpenetration.v1
  clearance_m: 0.0001
  inside_tolerance_m: 1.0e-05
  triangle_tolerance_m: 1.0e-08
  max_iterations: 12
  hand_translation_max_m: 0.008
  object_translation_max_m: 0.004
  root_rotation_max_rad: 0.08726646259971647
  articulation_rotation_max_rad: 0.13962634015954636
  object_rotation_max_rad: 0.08726646259971647
  translation_trust_m: 0.0015
  rotation_trust_rad: 0.026179938779914945
  finite_difference_rad: 0.001
  temporal_tiebreak_weight: 0.1
  surface_sigma_m: 0.005
scope:
  PPO: false
  video_alignment_used: false
  reference_is_GT: false
  full_sequence_attempts: 1
